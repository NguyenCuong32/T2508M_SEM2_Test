<!DOCTYPE html>
<html>

<head>
    <title>{{ title }}</title>
</head>

<body>
    <h1>{{ title }}</h1>
    <p><a href="{% url 'add_book' %}">Add New Book</a> |
        <a href="{% url 'book_list' %}">All Books</a> |
        <a href="{% url 'expensive_books' %}">Expensive Books</a> |
        <a href="{% url 'total_books' %}">Total Count</a>
    </p>
    <table border="1">
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Created At</th>
        </tr>
        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.price }}</td>
            <td>{{ book.created_at }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No books found.</td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
