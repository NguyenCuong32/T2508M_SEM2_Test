{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="bg-login-page">

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-dark">🔐 ĐĂNG NHẬP</h2>
                            <p class="text-muted">Hệ thống quản lý điểm thi sinh viên</p>
                        </div>

                        {% if error_message %}
                            <div class="alert alert-danger d-flex align-items-center" role="alert">
                                <div>⚠️ {{ error_message }}</div>
                            </div>
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-4">
                                {{ form.as_p }}
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">Đăng nhập ngay</button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <a href="{% url 'book_list' %}" class="text-decoration-none text-muted">← Quay lại trang chủ xem Sách</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
