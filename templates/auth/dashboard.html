{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản Trị - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0 text-center">
                    <div class="card-body p-5">
                        <div class="mb-4">
                            <span class="display-1 text-success">🎉</span>
                        </div>
                        <h1 class="fw-bold text-dark mb-2">Welcome, <span class="text-primary">{{ user.username }}</span>!</h1>
                        <p class="lead text-muted mb-4">Bạn đã vượt qua lớp kiểm tra bảo mật đăng nhập thành công vào trang quản trị hệ thống.</p>
                        
                        <div class="card bg-light border-0 p-3 mb-4 text-start">
                            <h6 class="fw-bold text-secondary mb-1">Quyền hạn tài khoản:</h6>
                            <p class="mb-0 text-success fw-semibold">✔ Administrator (Toàn quyền quản lý hệ thống)</p>
                        </div>

                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'book_list' %}" class="btn btn-primary btn-lg fw-bold px-4 shadow-sm">Trang quản lý sách</a>
                            
                            <form action="{% url 'logout' %}" method="POST" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-danger btn-lg px-4">Đăng xuất tài khoản</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
