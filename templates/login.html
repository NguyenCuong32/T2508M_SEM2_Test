{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block content %}
<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 4rem 0;
    }

    .login-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 2.5rem;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03), 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    .login-title {
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
        text-align: center;
    }

    .login-subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 2rem;
        text-align: center;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 0.5rem;
        color: var(--text-muted);
    }

    .form-group input {
        width: 100%;
        background: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        color: var(--text-main);
        font-size: 0.95rem;
        transition: all 0.2s ease;
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--primary);
        background: rgba(99, 102, 241, 0.02);
        box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .login-btn {
        width: 100%;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px var(--primary-glow);
        margin-top: 1rem;
    }

    .login-btn:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
    }

    .error-msg {
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #dc2626;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
    }
</style>

<div class="login-container">
    <div class="login-card">
        <h2 class="login-title">Chào Mừng Trở Lại</h2>
        <p class="login-subtitle">Đăng nhập để truy cập trang cá nhân của bạn</p>

        {% if form.errors %}
            <div class="error-msg">
                Tên đăng nhập hoặc mật khẩu không đúng. Vui lòng thử lại.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Tên đăng nhập</label>
                <input type="text" name="username" autofocus required id="id_username" placeholder="Nhập tên đăng nhập">
            </div>

            <div class="form-group">
                <label for="id_password">Mật khẩu</label>
                <input type="password" name="password" required id="id_password" placeholder="Nhập mật khẩu">
            </div>

            <button type="submit" class="login-btn">Đăng nhập</button>
        </form>
    </div>
</div>
{% endblock %}
