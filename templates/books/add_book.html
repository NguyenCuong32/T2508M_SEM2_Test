{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Sách Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-success text-white py-3 text-center">
                        <h4 class="mb-0 fw-bold">➕ THÊM SÁCH MỚI</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">Tiêu đề sách</label>
                                <input type="text" name="title" class="form-control form-control-lg" placeholder="Nhập tên cuốn sách..." required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">Tác giả</label>
                                <input type="text" name="author" class="form-control form-control-lg" placeholder="Nhập tên tác giả..." required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-secondary">Giá tiền ($)</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="0.01" name="price" class="form-control" placeholder="0.00" required>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg fw-bold">Lưu vào Hệ Thống</button>
                                <a href="{% url 'book_list' %}" class="btn btn-outline-secondary">Hủy bỏ & Quay lại</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
