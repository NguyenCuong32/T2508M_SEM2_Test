{% extends 'base.html' %}

{% block title %}Django Exam - Question Sheets{% endblock %}

{% block content %}
<style>
    .welcome-card {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(236, 72, 153, 0.03));
        border: 1px solid var(--border-color);
        padding: 2.5rem;
        border-radius: 8px;
        margin-bottom: 3rem;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .welcome-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.03) 0%, transparent 70%);
        pointer-events: none;
    }

    .welcome-title {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 1rem;
        letter-spacing: -1px;
    }

    .welcome-subtitle {
        color: var(--text-muted);
        font-size: 1.1rem;
        max-width: 600px;
        margin: 0 auto;
        line-height: 1.6;
    }

    .exercise-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
    }

    @media (max-width: 768px) {
        .exercise-grid {
            grid-template-columns: 1fr;
        }
    }

    .exercise-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .exercise-card:hover {
        transform: translateY(-5px);
        border-color: rgba(79, 70, 229, 0.3);
        box-shadow: 0 12px 20px rgba(79, 70, 229, 0.08);
    }

    .ex-badge {
        display: inline-block;
        background: rgba(79, 70, 229, 0.1);
        color: #4f46e5;
        padding: 0.35rem 0.75rem;
        border-radius: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 1rem;
        width: fit-content;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .ex-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 1rem;
    }

    .ex-description {
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
        flex-grow: 1;
    }

    .req-list {
        list-style: none;
        margin-bottom: 2rem;
    }

    .req-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.9rem;
        color: var(--text-main);
        margin-bottom: 0.6rem;
    }

    .req-icon {
        width: 6px;
        height: 6px;
        background: var(--primary);
        border-radius: 50%;
        flex-shrink: 0;
    }

    .card-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.03);
        color: var(--text-main);
        text-decoration: none;
        padding: 0.8rem 1.5rem;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.2s ease;
        border: 1px solid var(--border-color);
        gap: 0.5rem;
    }

    .exercise-card:hover .card-action {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
        box-shadow: 0 4px 12px var(--primary-glow);
    }
</style>

<div class="exercise-grid">
    <div class="exercise-card">
        <div>
            <h2 class="ex-title">Bài 1: Quản lý sách</h2>
        </div>
        <a href="{% url 'books' %}" class="card-action">
            Mở bài 1 <span>&rarr;</span>
        </a>
    </div>

    <div class="exercise-card">
        <div>
            <h2 class="ex-title">Bài 2: Xác thực người dùng</h2>
        </div>
        <a href="{% url 'dashboard' %}" class="card-action">
            Mở bài 2 <span>&rarr;</span>
        </a>
    </div>
</div>
{% endblock %}
