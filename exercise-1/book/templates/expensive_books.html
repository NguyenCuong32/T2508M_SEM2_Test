<h1>Books price > 100</h1>

<table border="1">
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Created</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.price }}</td>
        <td>{{ book.created_at }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">No expensive books</td>
    </tr>
    {% endfor %}
</table>
