<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f8f9fa;
        color: #2d3748;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        padding: 35px;
        width: 100%;
        max-width: 400px;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      .brand-title {
        font-size: 1.2rem;
        font-weight: 700;
        color: #1a202c;
        margin-bottom: 1.5rem;
        display: inline-block;
      }
      .brand-title span {
        color: #f3a833;
      }
      form p {
        margin-bottom: 1.25rem;
      }
      form p label {
        font-size: 0.85rem;
        font-weight: 500;
        color: #4a5568;
        display: block;
        margin-bottom: 0.4rem;
      }
      form p input {
        display: block;
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        font-size: 0.9rem;
      }
      form p input:focus {
        outline: none;
        border-color: #f3a833;
        box-shadow: 0 0 0 3px rgba(243, 168, 51, 0.15);
      }
      .btn-custom {
        background-color: #f3a833;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        width: 100%;
        padding: 10px;
        font-size: 0.9rem;
        transition: background-color 0.2s;
      }
      .btn-custom:hover {
        background-color: #d68716;
      }
      .errorlist {
        color: #e53e3e;
        font-size: 0.85rem;
        padding-left: 0;
        list-style: none;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand-title">Sign In / <span>Library</span></div>
      <form method="POST">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit" class="btn btn-custom mt-2">Đăng Nhập</button>
      </form>
    </div>
  </body>
</html>
