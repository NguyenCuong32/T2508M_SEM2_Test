{% extends 'base.html' %}

{% block title %}Login - Simple Auth{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card auth-card">
        <h1 class="auth-title">Welcome Back</h1>
        <p style="text-align: center; margin-bottom: 2rem;">Please sign in to access your dashboard.</p>
        
        <form method="POST" action="{% url 'accounts:login' %}" novalidate>
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-input" placeholder="Enter your username" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="id_password">Password</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="id_password" class="form-input" placeholder="Enter your password" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('id_password', this)">👁️</span>
                </div>
                <div style="text-align: right; margin-top: 0.5rem; font-size: 0.85rem;">
                    <a href="{% url 'accounts:forgot_password' %}" style="color: var(--text-secondary); text-decoration: none; font-weight: 500; transition: color 0.3s;" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-secondary)'">Forgot password?</a>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>
        
        <p class="auth-redirect">
            Don't have an account? <a href="{% url 'accounts:register' %}">Sign up</a>
        </p>
    </div>
</div>

<script>
    function togglePasswordVisibility(inputId, toggleEl) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            toggleEl.textContent = '🙈';
        } else {
            input.type = 'password';
            toggleEl.textContent = '👁️';
        }
    }
</script>
{% endblock %}
