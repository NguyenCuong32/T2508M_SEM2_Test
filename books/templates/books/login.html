{% extends 'books/base.html' %}

{% block title %}Login | Bookstore{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 2rem auto;">
    <div class="glass-card">
        <h2 class="gradient-text" style="text-align: center; margin-bottom: 2rem;">Sign In</h2>
        
        {% if form.errors %}
            <div class="error-list">
                <p>Invalid username or password. Please try again.</p>
            </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            
            <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                <label for="id_username">Username</label>
                <input type="text" name="username" autofocus required id="id_username" placeholder="Enter username">
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                <label for="id_password">Password</label>
                <input type="password" name="password" required id="id_password" placeholder="Enter password">
            </div>
            
            <button type="submit" class="btn-submit" style="width: 100%;">Login</button>
        </form>
    </div>
</div>
{% endblock %}
