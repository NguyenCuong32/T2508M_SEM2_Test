<h1>All Books</h1>

<a href="/books/add/">Add Book</a>

<table border="1">
<tr>
    <th>Title</th>
    <th>Author</th>
    <th>Price</th>
</tr>

{% for book in books %}
<tr>
    <td>{{ book.title }}</td>
    <td>{{ book.author }}</td>
    <td>{{ book.price }}</td>
</tr>
{% endfor %}

</table>
